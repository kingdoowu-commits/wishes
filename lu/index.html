<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>鲁老师，教师节快乐</title>
<meta name="theme-color" content="#2b1a12" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700;900&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#2f1c12;
    --ink-soft:#6b4a34;
    --gold:#c8933f;
    --gold-light:#f0cd8b;
    --rose:#c8543f;
    --paper-1:#fdf6ea;
    --paper-2:#f6e6cf;
    --paper-3:#efd7b8;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{height:100%;overflow:hidden;}

  body{
    font-family:"Noto Serif SC","Songti SC",serif;
    color:var(--ink);
    background:
      radial-gradient(120% 90% at 12% 4%, #fffdf7 0%, rgba(255,253,247,0) 55%),
      radial-gradient(100% 80% at 88% 96%, #f4dcbb 0%, rgba(244,220,187,0) 60%),
      linear-gradient(165deg, var(--paper-1) 0%, var(--paper-2) 52%, var(--paper-3) 100%);
    -webkit-font-smoothing:antialiased;
  }

  /* 纸张纤维质感 */
  body::before{
    content:"";
    position:fixed;inset:0;
    pointer-events:none;
    opacity:.5;
    background-image:
      radial-gradient(rgba(148,104,58,.10) .6px, transparent .7px),
      radial-gradient(rgba(148,104,58,.07) .6px, transparent .7px);
    background-size:7px 7px, 13px 13px;
    background-position:0 0, 4px 6px;
    mix-blend-mode:multiply;
  }

  /* 四角淡淡的暗角 */
  body::after{
    content:"";
    position:fixed;inset:0;pointer-events:none;
    box-shadow:inset 0 0 120px rgba(120,80,40,.16);
  }

  .stage{
    position:relative;
    height:100vh;
    height:100dvh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:calc(env(safe-area-inset-top) + 3.2vh) 22px calc(env(safe-area-inset-bottom) + 3vh);
    text-align:center;
    z-index:2;
  }

  /* ============ 装饰：花瓣 / 光斑 ============ */
  .decor{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1;}

  .glow{
    position:absolute;border-radius:50%;filter:blur(42px);opacity:.55;
    animation:breathe 9s ease-in-out infinite;
  }
  .glow.g1{width:44vw;height:44vw;left:-14vw;top:-12vw;background:radial-gradient(circle,rgba(240,205,139,.75),rgba(240,205,139,0) 70%);}
  .glow.g2{width:52vw;height:52vw;right:-18vw;bottom:-16vw;background:radial-gradient(circle,rgba(200,84,63,.35),rgba(200,84,63,0) 70%);animation-delay:2.5s;}

  @keyframes breathe{0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(1.12);opacity:.68}}

  .petal{
    position:absolute;top:-8vh;
    width:11px;height:11px;
    background:linear-gradient(140deg,#f6d9a5,#e0a55f);
    border-radius:80% 12% 80% 12%;
    opacity:0;
    animation:fall linear infinite;
    box-shadow:0 0 6px rgba(200,147,63,.35);
  }
  @keyframes fall{
    0%{transform:translate3d(0,-10vh,0) rotate(0deg);opacity:0}
    12%{opacity:.85}
    80%{opacity:.65}
    100%{transform:translate3d(var(--drift,4vw),112vh,0) rotate(560deg);opacity:0}
  }

  /* ============ 顶部小标 ============ */
  .eyebrow{
    display:inline-flex;align-items:center;gap:10px;
    font-family:"Noto Sans SC",sans-serif;
    font-size:clamp(10px,2.9vw,13px);
    letter-spacing:.32em;
    color:var(--ink-soft);
    opacity:.9;
    animation:rise .5s .02s both cubic-bezier(.2,.8,.2,1);
  }
  .eyebrow i{display:block;width:clamp(22px,7vw,44px);height:1px;background:linear-gradient(90deg,transparent,var(--gold));}
  .eyebrow i:last-child{background:linear-gradient(90deg,var(--gold),transparent);}

  /* ============ 主标题 ============ */
  .title-wrap{margin-top:clamp(10px,2.4vh,22px);position:relative;}

  .title{
    font-weight:900;
    font-size:clamp(38px,12.4vw,74px);
    line-height:1.06;
    letter-spacing:.06em;
    color:#75421a; /* 不支持渐变文字时的兜底颜色 */
    filter:drop-shadow(0 3px 10px rgba(120,74,30,.22));
    animation:rise .5s .08s both cubic-bezier(.2,.8,.2,1);
  }

  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    .title{
      background:linear-gradient(178deg,#3b2110 0%,#77441b 40%,#b8801f 72%,#6d3d18 100%);
      -webkit-background-clip:text;background-clip:text;
      -webkit-text-fill-color:transparent;
    }
  }

  .seal{
    position:absolute;
    right:calc(50% - clamp(122px,39.5vw,238px));
    top:-6px;
    width:clamp(38px,11.5vw,58px);height:clamp(38px,11.5vw,58px);
    border-radius:9px;
    background:linear-gradient(150deg,#c8543f,#a63a2a);
    color:#fff6ea;
    font-size:clamp(11px,3.3vw,15px);
    font-weight:700;line-height:1.15;
    display:flex;align-items:center;justify-content:center;
    letter-spacing:1px;
    box-shadow:0 6px 16px rgba(166,58,42,.32);
    transform:rotate(7deg);
    animation:stamp .6s .5s both cubic-bezier(.2,1.5,.4,1);
    opacity:.94;
  }
  @keyframes stamp{0%{transform:rotate(7deg) scale(1.9)}100%{transform:rotate(7deg) scale(1)}}

  /* ============ 老师名字 ============ */
  .name-row{
    margin-top:clamp(14px,3.2vh,28px);
    display:flex;align-items:center;justify-content:center;gap:clamp(10px,3.4vw,18px);
    animation:rise .5s .16s both cubic-bezier(.2,.8,.2,1);
  }
  .name-row .line{height:1px;width:clamp(26px,9vw,64px);background:linear-gradient(90deg,transparent,rgba(140,90,45,.55));}
  .name-row .line:last-child{background:linear-gradient(90deg,rgba(140,90,45,.55),transparent);}

  .name{
    position:relative;
    font-size:clamp(27px,8.6vw,46px);
    font-weight:700;
    letter-spacing:.14em;
    color:#3a2114;
    padding:0 2px 6px;
  }
  .name::after{
    content:"";
    position:absolute;left:2%;right:2%;bottom:0;height:8px;
    background:linear-gradient(90deg,rgba(240,205,139,0),rgba(226,176,96,.85),rgba(240,205,139,0));
    border-radius:8px;
    transform:scaleX(0);transform-origin:left;
    animation:sweep .7s .55s both cubic-bezier(.2,.8,.2,1);
  }
  @keyframes sweep{to{transform:scaleX(1)}}

  .wish{
    margin-top:clamp(12px,2.6vh,20px);
    font-family:"Noto Sans SC",sans-serif;
    font-size:clamp(12.5px,3.6vw,16px);
    line-height:2;
    color:var(--ink-soft);
    letter-spacing:.1em;
    max-width:20.5em;
    animation:rise .5s .24s both cubic-bezier(.2,.8,.2,1);
  }
  .wish b{color:#9c5f2c;font-weight:500;}

  /* ============ 音频播放器 ============ */
  .player{
    margin-top:clamp(20px,4.6vh,40px);
    width:min(92vw,384px);
    padding:clamp(14px,3.4vw,20px) clamp(15px,4vw,22px);
    border-radius:22px;
    background:linear-gradient(150deg,rgba(255,252,244,.94),rgba(252,238,216,.82));
    border:1px solid rgba(200,147,63,.34);
    box-shadow:
      0 18px 38px -16px rgba(112,68,26,.42),
      0 2px 0 rgba(255,255,255,.75) inset;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    display:flex;align-items:center;gap:clamp(12px,3.6vw,18px);
    animation:rise .5s .3s both cubic-bezier(.2,.8,.2,1);
  }

  /* 播放按钮 + 进度环 */
  .btn-wrap{position:relative;flex:0 0 auto;width:clamp(64px,18vw,80px);height:clamp(64px,18vw,80px);}

  .ripple{
    position:absolute;inset:0;border-radius:50%;
    border:1.5px solid rgba(200,147,63,.55);
    opacity:0;
  }
  .playing .ripple{animation:ripple 2.1s ease-out infinite;}
  .playing .ripple:nth-child(2){animation-delay:.7s;}
  .playing .ripple:nth-child(3){animation-delay:1.4s;}
  @keyframes ripple{0%{transform:scale(.92);opacity:.75}100%{transform:scale(1.75);opacity:0}}

  .ring{position:absolute;inset:0;transform:rotate(-90deg);}
  .ring circle{fill:none;stroke-width:3.4;stroke-linecap:round;}
  .ring .track{stroke:rgba(160,110,55,.18);}
  .ring .bar{stroke:url(#goldGrad);stroke-dasharray:var(--circ);stroke-dashoffset:var(--circ);transition:stroke-dashoffset .18s linear;}

  .play-btn{
    position:absolute;inset:7px;
    border:none;border-radius:50%;
    background:linear-gradient(148deg,#e9b25f 0%,#c8873a 52%,#a8672a 100%);
    color:#fffaf0;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    box-shadow:0 8px 18px -6px rgba(140,84,30,.7), 0 1px 0 rgba(255,255,255,.5) inset;
    transition:transform .16s ease, box-shadow .2s ease;
  }
  .play-btn:active{transform:scale(.93);}
  .play-btn svg{width:44%;height:44%;display:block;}
  .play-btn .ic-pause{display:none;}
  .playing .play-btn .ic-play{display:none;}
  .playing .play-btn .ic-pause{display:block;}

  .pulse{
    position:absolute;inset:-2px;border-radius:50%;
    box-shadow:0 0 0 0 rgba(200,147,63,.55);
    animation:pulse 2.4s ease-out infinite;
  }
  .playing .pulse{animation:none;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,147,63,.5)}70%{box-shadow:0 0 0 16px rgba(200,147,63,0)}100%{box-shadow:0 0 0 0 rgba(200,147,63,0)}}

  /* 右侧信息区 */
  .meta{flex:1 1 auto;min-width:0;text-align:left;}
  .meta .label{
    font-family:"Noto Sans SC",sans-serif;
    font-size:clamp(13px,3.7vw,15.5px);
    font-weight:500;color:#5a3a22;letter-spacing:.05em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .meta .hint{
    margin-top:4px;
    font-family:"Noto Sans SC",sans-serif;
    font-size:clamp(10.5px,3vw,12.5px);
    color:#9a7048;letter-spacing:.06em;
  }

  .bars{margin-top:9px;display:flex;align-items:flex-end;gap:3px;height:22px;}
  .bars span{
    flex:1 1 auto;
    max-width:6px;
    height:20%;
    border-radius:3px;
    background:linear-gradient(180deg,#e0ab5c,#c07f34);
    opacity:.42;
    transform-origin:bottom;
    transition:height .18s ease, opacity .3s ease;
  }
  .playing .bars span{opacity:.95;animation:eq .9s ease-in-out infinite alternate;}
  @keyframes eq{from{height:22%}to{height:100%}}

  .time{
    margin-top:7px;
    font-family:"Noto Sans SC",sans-serif;
    font-size:clamp(10px,2.8vw,11.5px);
    color:#a9814f;letter-spacing:.08em;font-variant-numeric:tabular-nums;
  }

  /* ============ 落款 ============ */
  .sign{
    margin-top:clamp(18px,4vh,32px);
    font-family:"Noto Sans SC",sans-serif;
    font-size:clamp(11px,3.1vw,13px);
    color:#8d6742;letter-spacing:.24em;
    animation:rise .5s .38s both cubic-bezier(.2,.8,.2,1);
  }
  .sign .heart{color:var(--rose);}

  @keyframes rise{from{transform:translateY(16px)}to{transform:none}}

  /* 极矮屏（横屏手机等）压缩间距，确保一屏显示 */
  @media (max-height:560px){
    .title{font-size:clamp(30px,8vh,44px)}
    .name{font-size:clamp(22px,5.6vh,32px)}
    .wish{display:none}
    .player{margin-top:14px}
    .sign{margin-top:12px}
  }
</style>
</head>
<body>

<div class="decor" id="decor">
  <div class="glow g1"></div>
  <div class="glow g2"></div>
</div>

<main class="stage">

  <div class="eyebrow"><i></i>2026 · 第 42 个教师节<i></i></div>

  <div class="title-wrap">
    <h1 class="title">教师节快乐</h1>
    <div class="seal">暖<br />心</div>
  </div>

  <div class="name-row">
    <span class="line"></span>
    <div class="name">鲁老师</div>
    <span class="line"></span>
  </div>

  <p class="wish">喝水、穿衣、午睡时轻轻拍背，<br />我们看不见的地方，<b>全是您的温柔</b>。</p>

  <!-- 音频播放器 -->
  <section class="player" id="player" aria-label="祝福音频播放器">
    <div class="btn-wrap" id="btnWrap">
      <span class="ripple"></span>
      <span class="ripple"></span>
      <span class="ripple"></span>
      <span class="pulse"></span>
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f0cd8b" />
            <stop offset="100%" stop-color="#b8762c" />
          </linearGradient>
        </defs>
        <circle class="track" cx="50" cy="50" r="47.3"></circle>
        <circle class="bar" id="progressBar" cx="50" cy="50" r="47.3"></circle>
      </svg>
      <button class="play-btn" id="playBtn" aria-label="播放祝福音频">
        <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.14v13.72a1 1 0 0 0 1.53.85l10.4-6.86a1 1 0 0 0 0-1.7L9.53 4.29A1 1 0 0 0 8 5.14z"/></svg>
        <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="4.5" width="4" height="15" rx="1.6"/><rect x="13.5" y="4.5" width="4" height="15" rx="1.6"/></svg>
      </button>
    </div>

    <div class="meta">
      <div class="label" id="stateLabel">送给鲁老师的一段祝福</div>
      <div class="hint" id="stateHint">轻触左侧按钮，听宝宝说给您听</div>
      <div class="bars" id="bars"></div>
      <div class="time"><span id="cur">00:00</span> / <span id="dur">00:00</span></div>
    </div>
  </section>

  <div class="sign">吴 启 明 和 爸 爸 妈 妈 <span class="heart">♡</span> 敬 上</div>
</main>

<!-- 占位祝福音频：后续把真实录音命名为 blessing.mp3 覆盖同目录文件即可，无需改代码 -->

<script>
(function () {
  // ---------- 花瓣装饰 ----------
  var decor = document.getElementById('decor');
  for (var i = 0; i < 14; i++) {
    var p = document.createElement('span');
    p.className = 'petal';
    p.style.left = (Math.random() * 100).toFixed(2) + 'vw';
    p.style.animationDuration = (9 + Math.random() * 9).toFixed(1) + 's';
    p.style.animationDelay = (-Math.random() * 14).toFixed(1) + 's';
    var s = (0.6 + Math.random() * 1.1).toFixed(2);
    p.style.transformOrigin = 'center';
    p.style.width = (8 * s).toFixed(1) + 'px';
    p.style.height = (8 * s).toFixed(1) + 'px';
    p.style.setProperty('--drift', ((Math.random() * 26 - 13).toFixed(1)) + 'vw');
    decor.appendChild(p);
  }

  // ---------- 均衡器条 ----------
  var bars = document.getElementById('bars');
  for (var j = 0; j < 22; j++) {
    var b = document.createElement('span');
    b.style.animationDelay = (Math.random() * 0.9).toFixed(2) + 's';
    b.style.animationDuration = (0.55 + Math.random() * 0.7).toFixed(2) + 's';
    bars.appendChild(b);
  }

  // ---------- 播放控制 ----------
  var audio = document.getElementById('audio');
  var player = document.getElementById('player');
  var btn = document.getElementById('playBtn');
  var barEl = document.getElementById('progressBar');
  var curEl = document.getElementById('cur');
  var durEl = document.getElementById('dur');
  var label = document.getElementById('stateLabel');
  var hint = document.getElementById('stateHint');

  var R = 47.3;
  var CIRC = 2 * Math.PI * R;
  barEl.style.setProperty('--circ', CIRC.toFixed(2));

  function fmt(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
  }

  function setProgress(ratio) {
    var r = Math.max(0, Math.min(1, ratio || 0));
    barEl.style.strokeDashoffset = (CIRC * (1 - r)).toFixed(2);
  }
  setProgress(0);

  audio.addEventListener('loadedmetadata', function () {
    durEl.textContent = fmt(audio.duration);
  });

  audio.addEventListener('timeupdate', function () {
    curEl.textContent = fmt(audio.currentTime);
    if (audio.duration) setProgress(audio.currentTime / audio.duration);
  });

  audio.addEventListener('play', function () {
    player.classList.add('playing');
    btn.setAttribute('aria-label', '暂停祝福音频');
    label.textContent = '正在播放 · 送给鲁老师';
    hint.textContent = '谢谢您，让他喜欢上幼儿园';
  });

  function toIdle(text) {
    player.classList.remove('playing');
    btn.setAttribute('aria-label', '播放祝福音频');
    label.textContent = '送给鲁老师的一段祝福';
    hint.textContent = text;
  }

  audio.addEventListener('pause', function () {
    if (!audio.ended) toIdle('已暂停，轻触继续聆听');
  });

  audio.addEventListener('ended', function () {
    toIdle('播放完毕，想再听一遍就点我');
    setProgress(0);
    curEl.textContent = '00:00';
  });

  function useFallback(reason) {
    if (audio.dataset.fallback || !window.__FALLBACK_AUDIO__) return;
    audio.dataset.fallback = '1';
    console.warn('外链音频不可用（' + reason + '），已切换到内联音频');
    audio.src = window.__FALLBACK_AUDIO__;
    audio.load();
  }

  // 启动时探测外链音频是否可用；不可用则立即切换到内联音频
  try {
    fetch('./blessing.mp3', { method: 'HEAD' })
      .then(function (r) { if (!r.ok) useFallback('HTTP ' + r.status); })
      .catch(function (e) { useFallback(e && e.message ? e.message : 'network'); });
  } catch (e) {
    useFallback('fetch unavailable');
  }

  audio.addEventListener('error', function () {
    // 外链音频不可用时（例如静态托管未提供媒体文件），自动回退到内联音频
    if (!audio.dataset.fallback && window.__FALLBACK_AUDIO__) {
      useFallback('media error');
      return;
    }
    toIdle('音频加载失败，请稍后再试');
    console.error('音频加载失败：', audio.currentSrc);
  });

  btn.addEventListener('click', function () {
    if (audio.paused) {
      var p = audio.play();
      if (p && typeof p.catch === 'function') {
        p.catch(function (err) {
          console.error('播放失败：', err);
          toIdle('请再轻触一次以开始播放');
        });
      }
    } else {
      audio.pause();
    }
  });
})();
</script>
